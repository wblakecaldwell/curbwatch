[project]
name = "nestmon"
version = "0.1.0"
description = "Pull Nest camera snapshots through a Starling Home Hub and check whether the garbage cans are at the curb with a local vision model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "anthropic>=0.70",
    "python-dotenv>=1.0",
    "opencv-python-headless>=5.1.0.95",
    "numpy>=2.4.6",
]

[project.scripts]
nestmon = "nestmon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
